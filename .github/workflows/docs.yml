# Publishes the documentation (mkdocs) to GitHub Pages, served at
# https://build.oceansoft.org, when it changes on main. Pull requests only
# build it (check.yml).
name: Docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# A deployment in progress finishes; a newer pending one replaces an older one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    # The same mkdocs as check.yml's
    container: ubuntu:26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install mkdocs
        run: apt-get update && apt-get install -y --no-install-recommends mkdocs mkdocs-material

      - name: Build documentation
        run: mkdocs build --strict --site-dir site

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
