# Releases a project when its debian/changelog changes on main (i.e. a new
# release is cut), or on demand for one project. The changelog version's
# upstream tag picks the channel: beta if it matches the project's
# release.beta_tags, otherwise release. Building and publishing are in
# build-debian.yml; publishing waits for approval in the channel's GitHub
# Environment.
name: Release
# Started by hand, the run is named after the project; a push keeps the default (the commit title)
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release {0}', inputs.project) || '' }}

on:
  push:
    branches:
      - main
    paths:
      - projects/*/debian/changelog
      - dependencies/*/debian/changelog
  workflow_dispatch:
    inputs:
      project:
        description: Project (in projects/ or dependencies/) to build and publish
        type: string
        required: true

permissions:
  contents: read

jobs:
  projects:
    name: Find projects to release
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.projects.outputs.releases }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: List projects
        id: projects
        env:
          REQUESTED: ${{ inputs.project }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "::error::Releases are published from main only, not ${GITHUB_REF}"
            exit 1
          fi
          if ! python3 -c 'import yaml' 2>/dev/null || ! command -v dpkg-parsechangelog > /dev/null; then
            sudo apt-get update && sudo apt-get install -y python3-yaml dpkg-dev
          fi
          if [ -n "${REQUESTED}" ]; then
            projects=("${REQUESTED}")
          else
            mapfile -t projects < <(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" -- 'projects/*/debian/changelog' 'dependencies/*/debian/changelog' | cut -d/ -f2 | sort -u)
          fi
          # Dependencies first: the matrix runs one release at a time, in this order
          if [ ${#projects[@]} -gt 0 ]; then
            mapfile -t projects < <(ci/project-config order "${projects[@]}" | python3 -c 'import json, sys; print(*json.load(sys.stdin), sep="\n")')
          fi
          # Each project's channel comes from its changelog version's upstream tag (or pinned commit).
          releases=()
          for project in "${projects[@]}"; do
            if [ "$(ci/project-config "${project}" get release.enabled)" != true ]; then
              echo "${project}: release.enabled is false, nothing to release"
              continue
            fi
            channel=$(ci/project-config "${project}" channel)
            echo "${project} $(ci/project-config "${project}" release-tag) $(ci/project-config "${project}" release-commit) -> ${channel}"
            releases+=("${project}:${channel}")
          done
          echo "releases=$(printf '%s\n' "${releases[@]}" | python3 -c '
          import json, sys
          print(json.dumps([dict(zip(("project", "channel"), r.split(":"))) for r in sys.stdin.read().split()]))
          ')" >> "${GITHUB_OUTPUT}"

  release:
    name: ${{ matrix.project }} (${{ matrix.channel }})
    needs: projects
    if: needs.projects.outputs.releases != '[]'
    strategy:
      fail-fast: false
      # GitHub keeps only one pending job per concurrency group, so a third
      # project waiting to publish would cancel the second.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.projects.outputs.releases) }}
    uses: ./.github/workflows/build-debian.yml
    with:
      project: ${{ matrix.project }}
      channel: ${{ matrix.channel }}
      publish: true
    secrets: inherit
