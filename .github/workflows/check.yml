# Checks pull requests: lints and tests the ci/ scripts, builds the docs, then builds and
# install-tests each changed project on its install-test target only (a project
# with release.enabled false builds its continuous head). Nothing is published.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Lint and test ci/
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aptly devscripts dpkg-dev gnupg openssh-client python3-yaml shellcheck

      - name: Lint shell scripts
        run: shellcheck ci/fetch-source ci/install-test ci/stage-debian scripts/apt-setup

      - name: Check every project's settings
        run: |
          set -euo pipefail
          for project in $(ci/project-config list | python3 -c 'import json, sys; print(*json.load(sys.stdin))'); do
            ci/project-config "${project}" matrix > /dev/null
            ci/project-config "${project}" install-script > /dev/null
          done

      - name: Run tests
        run: python3 -m unittest discover -s ci/tests -v

  docs:
    name: Documentation (mkdocs)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install mkdocs
        run: apt-get update && apt-get install -y --no-install-recommends mkdocs mkdocs-material

      - name: Build documentation
        run: mkdocs build --strict

  projects:
    name: Find changed projects
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.projects.outputs.builds }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: List projects
        id: projects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! python3 -c 'import yaml' 2>/dev/null || ! command -v dpkg-parsechangelog > /dev/null; then
            sudo apt-get update && sudo apt-get install -y python3-yaml dpkg-dev
          fi
          changed=$(git diff --name-only "${BASE}...HEAD")
          # release.yml would release these on merge; a dependent's check here ran
          # against its dependency's old packages, so they go in separate pull requests
          mapfile -t releasing < <({ grep -E '^projects/[^/]+/debian/changelog$' <<< "${changed}" || true; } | cut -d/ -f2)
          if [ ${#releasing[@]} -gt 1 ] && ! ci/project-config release-conflicts "${releasing[@]}" 2> /tmp/conflicts; then
            while read -r line; do echo "::error::${line}"; done < /tmp/conflicts
            exit 1
          fi
          # A change to the shared build affects every project.
          if grep -qvE '^(projects/|README\.md$|docs/|mkdocs\.yml$)' <<< "${changed}"; then
            mapfile -t projects < <(ci/project-config list | python3 -c 'import json, sys; print(*json.load(sys.stdin), sep="\n")')
          else
            mapfile -t projects < <({ grep '^projects/' <<< "${changed}" || true; } | cut -d/ -f2 | sort -u)
          fi
          # Each build is {"project", "channel", "source_ref", "version"}: the changelog version
          # for the channel it would release to, or the continuous head for a project that only
          # builds snapshots. The channel picks the channels its build_depends come from.
          builds=()
          for project in "${projects[@]}"; do
            if [ "$(ci/project-config "${project}" get release.enabled)" = true ]; then
              channel=$(ci/project-config "${project}" channel)
              builds+=("{\"project\": \"${project}\", \"channel\": \"${channel}\", \"source_ref\": \"\", \"version\": \"\"}")
            else
              head=$(ci/continuous-heads --project "${project}" --unverified | python3 -c 'import json, sys; print(json.dumps(json.load(sys.stdin)[0]))')
              builds+=("$(python3 -c 'import json, sys; h = json.loads(sys.argv[1]); print(json.dumps({"project": h["project"], "channel": "continuous", "source_ref": h["sha"], "version": h["version"]}))' "${head}")")
            fi
          done
          echo "builds=[$(IFS=,; echo "${builds[*]}")]" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.project }}
    needs: projects
    if: needs.projects.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.projects.outputs.builds) }}
    uses: ./.github/workflows/build-debian.yml
    with:
      project: ${{ matrix.project }}
      channel: ${{ matrix.channel }}
      all_targets: false
      source_ref: ${{ matrix.source_ref }}
      version: ${{ matrix.version }}
