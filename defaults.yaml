# Settings shared by every project in projects/ and dependencies/. A project's project.yaml
# overrides any of these; mappings merge key by key, lists are replaced.

targets:
  arch: [amd64, arm64]
  dists:
    - { distro: debian, dist: bookworm }
    - { distro: debian, dist: trixie }
    - { distro: ubuntu, dist: jammy }
    - { distro: ubuntu, dist: noble }
    - { distro: ubuntu, dist: resolute }

# Where users read the channels: CloudFront in front of the bucket's apt/.
apt_url: https://apt.oceansoft.org

# Each channel is its own apt repository under apt/<prefix><distro>-<dist>
# in the bucket, published from the named GitHub Environment. It is signed
# with the (sub)key signing_key, whose public key is in key.
channels:
  release:
    prefix: release/
    environment: release
    signing_key: D7D7224D53A4F29E303FE01DEB505B68A5D063B0
    key: keys/release.asc
    # Channels whose packages a build for this channel can build-depend on
    # (build_depends.projects)
    build_against: [release]
  # Prereleases, chosen per project by release.beta_tags. Users add it next to
  # release; a prerelease version (~) sorts below its final release.
  beta:
    prefix: beta/
    environment: release
    signing_key: D7D7224D53A4F29E303FE01DEB505B68A5D063B0
    key: keys/release.asc
    build_against: [release, beta]
  # Builds of each new head of a project's default branch (continuous.yml).
  # Published without human approval, so it has its own key and credentials.
  continuous:
    prefix: continuous/
    environment: continuous
    signing_key: DAF08DD7788E6C84C6F8E8D3E59E1A81FECDB228
    key: keys/continuous.asc
    # Newest versions kept of each source package
    keep: 5
    build_against: [release, continuous]

# Package repositories other than the distribution's and ours, which a
# project can build-depend on (build_depends.repositories). {distro} and
# {dist} in url and suite are the build target's.
repositories:
  zenoh:
    url: https://download.eclipse.org/zenoh/debian-repo/
    # A flat repository: one suite for every distribution, no components
    suite: /
    components: []
    key: trust/zenoh.asc
    fingerprint: 0ABC5913672BBE50921B3B9395D19EA1F7DF9E8E
    # The repository keeps every version and moves forward: build against this one
    pin:
      packages: [libzenohc, libzenohc-dev, libzenohcpp-dev]
      version: 1.10.2

build_depends:
  # Projects (in projects/ or dependencies/) whose packages this one build-depends on: builds
  # see their channel's packages (channels.<channel>.build_against), and
  # release.yml and continuous.yml build them first
  projects: []
  # Names in repositories:
  repositories: []

upstream:
  # The upstream tag for a version (Debian "~" becomes prerelease_separator, +dfsg is dropped);
  # null for an upstream that doesn't tag releases (needs release.commit)
  tag_format: "v{version}"
  prerelease_separator: "-"
  # Include git submodules, at the commits the source records, in the .orig tarball
  submodules: false

release:
  # false for a project built only as continuous snapshots: a changelog
  # change on main releases nothing, and pull requests check the head instead
  enabled: true
  # Fetch (source: git) only tags signed by one of projects/<name>/maintainers.yaml.
  require_signed_tag: false
  # For a project in dependencies/, which nobody we list signs: the full commit hash
  # this release is, reviewed in the pull request that sets it. The release tag must
  # point at it; without upstream tags, the changelog version is
  # <base>+git<YYYYMMDD>.<first 7 of the hash>, after the commit's date.
  commit: null
  # Regular expression for upstream tags that publish to the beta channel
  # rather than release; null for none.
  beta_tags: null

continuous:
  enabled: false
  # A head commit qualifies if a maintainer signed it, or (with this on) GitHub
  # signed it when a maintainer merged a pull request in its web UI.
  accept_github_merges: true
  # true once the project's repository starts continuous.yml on each push;
  # until then continuous.yml polls the project every 6 hours.
  push_dispatch: false
  # Branch to build instead of upstream.git's default branch
  branch: null
  # Upstream version the snapshots follow when no release tag is reachable from
  # the head (a fork without tags, or a branch upstream tags elsewhere)
  version_base: null

# Where every newly built package is installed before publishing.
install_test:
  target: { distro: ubuntu, dist: resolute, arch: amd64 }
  packages: []
  commands: []
