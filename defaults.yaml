# Settings shared by every project in projects/. A project's project.yaml
# overrides any of these; mappings merge key by key, lists are replaced.

targets:
  arch: [amd64, arm64]
  dists:
    - { distro: debian, dist: bookworm }
    - { distro: debian, dist: trixie }
    - { distro: ubuntu, dist: jammy }
    - { distro: ubuntu, dist: noble }
    - { distro: ubuntu, dist: resolute }

# Each channel is its own apt repository under apt/<prefix><distro>-<dist>
# in the bucket, published from the named GitHub Environment.
channels:
  release: { prefix: "release/", environment: release }

# Where every newly built package is installed before publishing.
install_test:
  target: { distro: ubuntu, dist: resolute, arch: amd64 }
  packages: []
  commands: []
